resources:
# =============================================================================
# Applications layer — sample apps / pipelines that run ON the products above.
# All disabled by default; uncomment to deploy. Non-portfolio demos
# (bookinfo / soapserver / cp4a) removed 2026-07.
# =============================================================================

# ---- App Connect (ACE) ----
#- argocd/ace/cicd.yaml
#- argocd/ace/dev.yaml
#- argocd/ace/stage.yaml
#- argocd/ace/prod.yaml

# ---- MQ ----
#- argocd/mq/cicd.yaml
#- argocd/mq/dev.yaml
#- argocd/mq/stage.yaml
#- argocd/mq/prod.yaml

# ---- API Connect (APIC) ----
#- argocd/apic/cicd.yaml
#- argocd/apic/dev.yaml
#- argocd/apic/stage.yaml
#- argocd/apic/prod.yaml
#- argocd/apic/single-cluster-pipelines.yaml
#- argocd/apic/single-cluster-config.yaml
#- argocd/apic/single-cluster-cp4i.yaml
#- argocd/apic/multi-cluster-app.yaml
#- argocd/apic/multi-cluster-ops.yaml

# ---- Event Streams ----
#- argocd/es/dev.yaml

patches:
- target:
    group: argoproj.io
    kind: Application
    labelSelector: "gitops.tier.layer=applications"
  patch: |-
    - op: add
      path: /spec/source/repoURL
      value: https://github.com/ibmclientengineering/multi-tenancy-gitops-apps.git
    - op: add
      path: /spec/source/targetRevision
      value: master
